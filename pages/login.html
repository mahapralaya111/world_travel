<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 国际旅游规划助手</title>
<script src="/static/js/api.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c4a6e 100%);
        display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
        width: 100%; max-width: 420px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px; padding: 36px 34px 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo .icon { font-size: 46px; }
    .auth-logo h1 { color: #fff; font-size: 22px; margin: 10px 0 4px; }
    .auth-logo p { color: #94a3b8; font-size: 13px; }
    .tabs { display: flex; background: rgba(255,255,255,0.06); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab {
        flex: 1; text-align: center; padding: 10px 0; border-radius: 9px;
        color: #94a3b8; font-size: 14px; cursor: pointer; transition: all .2s ease;
        border: none; background: transparent; font-weight: 600;
    }
    .tab.active { background: #4a9eff; color: #fff; box-shadow: 0 4px 14px rgba(74,158,255,0.35); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: #cbd5e1; font-size: 13px; margin-bottom: 6px; }
    .form-group input {
        width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
        color: #fff; font-size: 14px; outline: none; transition: all .2s ease;
    }
    .form-group input:focus { border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.15); }
    .form-group input::placeholder { color: #64748b; }
    .submit-btn {
        width: 100%; padding: 13px 0; background: linear-gradient(135deg, #4a9eff, #2563eb);
        color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
        cursor: pointer; transition: all .2s ease; margin-top: 4px;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(74,158,255,0.4); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .msg { text-align: center; font-size: 13px; margin-top: 14px; min-height: 20px; color: #fbbf24; }
    .msg.ok { color: #4ade80; }
    .back-link { display: block; text-align: center; margin-top: 18px; color: #64748b; font-size: 13px; text-decoration: none; }
    .back-link:hover { color: #4a9eff; }
    .hint { text-align: center; color: #475569; font-size: 12px; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="auth-card">
    <div class="auth-logo">
        <div class="icon">🌍</div>
        <h1>国际旅游规划助手</h1>
        <p>登录后数据自动云端同步</p>
    </div>

    <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">登 录</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">注 册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">登 录</button>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" onsubmit="return doRegister(event)" style="display:none;">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUsername" placeholder="2-20位中英文/数字/下划线">
        </div>
        <div class="form-group">
            <label>昵称（可选）</label>
            <input type="text" id="regNickname" placeholder="展示名称，默认为用户名">
        </div>
        <div class="form-group">
            <label>邮箱（可选）</label>
            <input type="email" id="regEmail" placeholder="用于找回密码">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="至少6位">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regPassword2" placeholder="再次输入密码">
        </div>
        <button type="submit" class="submit-btn" id="regBtn">注册并开始规划</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="back-link" href="/">← 返回地图</a>
    <div class="hint">未登录时数据保存在本机浏览器，<br>注册登录后即可享受多设备云端同步</div>
</div>

<script>
    // 根据 URL 参数切换初始 tab（register）
    const mode = new URLSearchParams(location.search).get('mode');
    if (mode === 'register') switchTab('register');

    function switchTab(name) {
        const isLogin = name === 'login';
        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabRegister').classList.toggle('active', !isLogin);
        document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
        document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
        showMsg('', '');
    }

    function showMsg(text, cls) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = 'msg' + (cls ? ' ' + cls : '');
    }

    async function doLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) { showMsg('请输入用户名和密码'); return false; }
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = '登录中...';
        showMsg('', '');
        try {
            const res = await API.login({ username, password });
            if (res.code === 0) {
                API.token = res.data.token;
                API.user = { id: res.data.id, username: res.data.username, nickname: res.data.nickname };
                showMsg('登录成功，正在跳转...', 'ok');
                setTimeout(() => location.href = '/', 600);
            } else {
                showMsg(res.msg || '登录失败');
            }
        } catch (err) {
            showMsg('无法连接服务器，请确认后端已启动');
        } finally {
            btn.disabled = false; btn.textContent = '登 录';
        }
        return false;
    }

    async function doRegister(e) {
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const nickname = document.getElementById('regNickname').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const password2 = document.getElementById('regPassword2').value;
        if (!username) { showMsg('请输入用户名'); return false; }
        if (password.length < 6) { showMsg('密码长度至少6位'); return false; }
        if (password !== password2) { showMsg('两次输入的密码不一致'); return false; }
        const btn = document.getElementById('regBtn');
        btn.disabled = true; btn.textContent = '注册中...';
        showMsg('', '');
        try {
            const res = await API.register({ username, password, nickname, email });
            if (res.code === 0) {
                API.token = res.data.token;
                API.user = { id: res.data.id, username: res.data.username, nickname: res.data.nickname };
                showMsg('注册成功，正在跳转...', 'ok');
                setTimeout(() => location.href = '/', 600);
            } else {
                showMsg(res.msg || '注册失败');
            }
        } catch (err) {
            showMsg('无法连接服务器，请确认后端已启动');
        } finally {
            btn.disabled = false; btn.textContent = '注册并开始规划';
        }
        return false;
    }
</script>
</body>
</html>
